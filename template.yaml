AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Freshworks-inspired serverless support-ticket API for an IT457 Cloud Computing project.
  API Gateway HTTP API -> Lambda (Python) -> DynamoDB. Student/demo use only.

# ---------------------------------------------------------------------------
# Parameters: values you can change at deploy time (see scripts/deploy.sh).
# ---------------------------------------------------------------------------
Parameters:
  LambdaMemoryMb:
    Type: Number
    Default: 128
    AllowedValues: [128, 256, 512]
    Description: Lambda memory in MB. Change it for the optional memory experiment.
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]
    Description: How long CloudWatch keeps Lambda logs. Short = less storage cost.
  TicketTtlDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 30
    Description: Tickets are deleted automatically by DynamoDB TTL after this many days.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Timeout: 10

Resources:
  # --- API Gateway HTTP API (charged per request) --------------------------
  TicketHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: HTTP API for the support-ticket demo
      # Safety net: caps accidental request bursts. Requests above these limits get HTTP 429.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  # --- DynamoDB table (on-demand: you pay per read/write, no idle capacity) ---
  SupportTicketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-SupportTickets'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticketId
          AttributeType: S
      KeySchema:
        - AttributeName: ticketId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # --- CloudWatch log group with short retention ----------------------------
  TicketFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: !Ref LogRetentionDays

  # --- Lambda function (charged per request and per GB-second) --------------
  TicketFunction:
    Type: AWS::Serverless::Function
    DependsOn: TicketFunctionLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      CodeUri: src/
      Handler: app.lambda_handler
      MemorySize: !Ref LambdaMemoryMb
      Environment:
        Variables:
          TABLE_NAME: !Ref SupportTicketsTable
          TICKET_TTL_DAYS: !Ref TicketTtlDays
          DYNAMODB_ENDPOINT_URL: ''
      # Least privilege: only two DynamoDB actions, only on our own table.
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource: !GetAtt SupportTicketsTable.Arn
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref TicketHttpApi
            Path: /health
            Method: GET
        CreateTicket:
          Type: HttpApi
          Properties:
            ApiId: !Ref TicketHttpApi
            Path: /tickets
            Method: POST
        GetTicket:
          Type: HttpApi
          Properties:
            ApiId: !Ref TicketHttpApi
            Path: /tickets/{ticketId}
            Method: GET

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API (no trailing slash)
    Value: !Sub 'https://${TicketHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  TableName:
    Description: DynamoDB table name
    Value: !Ref SupportTicketsTable
  FunctionName:
    Description: Lambda function name
    Value: !Ref TicketFunction
  LogGroupName:
    Description: CloudWatch log group (look here for REPORT lines and Init Duration)
    Value: !Ref TicketFunctionLogGroup
